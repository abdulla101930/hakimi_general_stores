<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Hakimi General Store Ratlam - Instant grocery & hygiene delivery app." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hakimi General Store Ratlam</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This app needs JavaScript enabled to run.</noscript>

    <div id="boot-splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;transition:opacity .25s ease">
      <div style="width:56px;height:56px;border-radius:16px;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:30px">🛒</div>
      <div style="font-size:16px;font-weight:600">Hakimi General Store</div>
      <div id="boot-status" style="font-size:12px;color:#64748b">Loading…</div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        // Boot safety net: if the app shell hasn't mounted within ~12s, offer recovery.
        var bootStarted = Date.now();
        var hideSplash = function () {
          var s = document.getElementById('boot-splash');
          if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
        };
        window.__hideBootSplash = hideSplash;

        window.deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.deferredPwaPrompt = e;
        });

        function setBootStatus(msg) {
          var el = document.getElementById('boot-status');
          if (el) el.textContent = msg;
        }
        window.__setBootStatus = setBootStatus;

        var watcher = new MutationObserver(function () {
          var root = document.getElementById('root');
          if (root && root.children.length) { hideSplash(); watcher.disconnect(); }
        });
        if (document.getElementById('root') && document.getElementById('root').children.length) {
          hideSplash();
        } else {
          watcher.observe(document.getElementById('root'), { childList: true });
        }

        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            setBootStatus('Taking too long. Tap to retry.');
            var el = document.getElementById('boot-status');
            el.style.cursor = 'pointer';
            el.onclick = function () { window.location.reload(); };
          }
        }, 12000);
        void bootStarted;
      })();
    </script>
  </body>
</html>
