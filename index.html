<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Hakimi General Store Ratlam - Instant grocery & hygiene delivery app." />
    <title>Hakimi General Store Ratlam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Global PWA Install Prompt Capture
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Static SW registration path with updateViaCache none
          navigator.serviceWorker.register('./sw.js?v=v6', { updateViaCache: 'none' }).then((registration) => {
            registration.update();
          }).catch(err => {
            console.log('Service Worker Registration Failed:', err);
          });
        });

        // Controllerchange listener with session storage reload guard to prevent loops
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          const reloadedKey = 'sw_controller_reloaded';
          if (!sessionStorage.getItem(reloadedKey)) {
            sessionStorage.setItem(reloadedKey, 'true');
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
